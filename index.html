const raw=[
[1,1,"Port terminology","C1-C2","Stimulus: The arrival notice says: 'At 08:00, the vessel enters the sheltered area where ships berth and cargo is handled.'\nQuestion: Which place does the notice describe?",["A port","An engine room","A bow","A helm","A keel"],0],
[2,1,"Port terminology","C1-C2","Stimulus: The port message reads: 'Berth 4 is ready. Bring the vessel alongside the quay and secure its lines.'\nQuestion: What does the vessel do at Berth 4?",["It flies above the port","It docks alongside the quay","It repairs its compass","It becomes a warehouse","It remains offshore"],1],
[3,1,"Maritime terminology","C1-C2","Stimulus: A shipping record lists one large vessel carrying 200 containers, not passengers, from Laimu to another port.\nQuestion: Which term best classifies this vessel?",["Pilot","Anchor","Cargo vessel","Buoy","Jetty"],2],
[4,1,"Port terminology","C1-C2","Stimulus: The harbor plan shows a narrow platform projecting from shore into the water; small vessels tie up along its sides.\nQuestion: Which port facility is shown?",["Bridge","Hull","Funnel","Jetty","Cabin"],3],
[5,1,"Maritime pronunciation","C1-C2","Stimulus: A radio instruction says, 'Unload beside the quay.' The trainee hears /keɪ/ and must match the spoken word to the written port sign.\nQuestion: Which sign should the trainee choose?",["Sea","Key","Crew","Deck","Quay"],4],
[6,1,"Port terminology","C3","Stimulus: The manifest lists 120 sealed containers. The harbor map offers a container terminal, a fishing pier, and a passenger terminal.\nQuestion: Where should the vessel go to load its listed cargo?",["Container terminal","Engine workshop","Crew cabin","Chart room","Ship's galley"],0],
[7,1,"Port terminology","C3","Stimulus: The loading checklist reads: 'First, the vessel comes alongside the quay and secures its lines. Then the cranes start loading.'\nQuestion: Complete the report in Simple Present: 'The vessel ___ at the quay before loading.'",["sail","berths","steer","navigate","anchor"],1],
[8,1,"Port terminology","C4-C6","Stimulus: A ship reaches port at 06:00, but its berth is occupied until 09:00. The port instructs it to wait at anchor and sends an assignment when the berth is free.\nQuestion: Which sequence follows the port's instructions?",["Unload, sail, berth","Berth, anchor, arrive","Arrive, anchor, receive berth assignment, berth","Sail, berth, arrive, anchor","Load, anchor, arrive"],2],
[9,2,"Nautical crew","C1-C2","Stimulus: The crew chart places the Chief Officer and Chief Engineer under one person who has overall command of the vessel.\nQuestion: Which crew position is at the top of this chart?",["Oiler","Second Engineer","Able Seafarer","Master","Cook"],3],
[10,2,"Engineering crew","C1-C2","Stimulus: An engine-room report goes from the Second Engineer to the head of the engineering department for approval.\nQuestion: Who approves the report?",["Chief Officer","Master","Bosun","Deck Cadet","Chief Engineer"],4],

document.addEventListener("submit",e=>{e.preventDefault();let f=e.target,d=new FormData(f);
if(f.id==="identity-form"){if(activeDraft()){notify("Selesaikan ujian yang masih berjalan terlebih dahulu.",true);return}let name=String(d.get("name")||"").trim(),nis=String(d.get("nis")||"").trim(),number=String(d.get("number")||"").trim(),grade=String(d.get("grade")||"").trim();if(!name||!nis||!number||!grade){notify("Lengkapi seluruh identitas.",true);return}if(!["X. NKPI","X. ABPAL"].includes(grade)){notify("Pilih kelas X. NKPI atau X. ABPAL.",true);return}if(db.participants.some(p=>p.nis===nis&&p.number===number)){notify("NIS/NISN dan nomor peserta ini sudah memiliki hasil pada perangkat ini.",true);return}db.draft={id:"p"+Date.now()+"_"+Math.random().toString(36).slice(2,8),name,nis,grade,number,status:"belum selesai",answers:{},doubts:[],marks:{}};save();phase="confirm";renderExam()}
if(f.id==="settings-form"&&teacher){let c={};for(let k of ["school","subject","grade","year","teacher"])c[k]=String(d.get(k)||"").trim();for(let k of ["duration","kkm","pgWeight","essayWeight"])c[k]=Number(d.get(k));if(Object.values(c).some(v=>v===""||typeof v==="number"&&!Number.isFinite(v))||c.duration<1||c.duration>600||c.kkm<0||c.kkm>100||c.pgWeight<0||c.essayWeight<0||c.pgWeight+c.essayWeight===0){notify("Periksa pengaturan: durasi 1–600, KKM 0–100, dan jumlah bobot harus lebih dari nol.",true);return}db.config=c;save();render();notify("Pengaturan disimpan. Perubahan durasi berlaku untuk ujian baru.")}
if(f.id==="grade-form"&&teacher){let p=db.participants.find(x=>x.id===f.dataset.id);if(!p)return;let marks={};for(let q of es()){let value=Number(d.get(String(q.n)));if(d.get(String(q.n))===""||!Number.isFinite(value)||value<0||value>100){notify("Nilai setiap essay harus berada pada 0–100.",true);return}marks[q.n]=value}p.marks=marks;save();closeModal();render();notify("Nilai essay tersimpan.")}
if(f.id==="question-form"&&teacher){let type=d.get("type"),n=Number(d.get("n")),details=String(d.get("details")||"").split("\n").map(s=>s.trim()).filter(Boolean),key=String(d.get("key")||"").trim().toUpperCase(),q={n,goal:Number(d.get("goal")),material:String(d.get("material")||"").trim(),type,level:String(d.get("level")),text:String(d.get("text")||"").trim(),guide:String(d.get("guide")||"").trim()};if(!Number.isInteger(n)||n<1||db.questions.some(x=>x.n===n&&x.n!==editing)){notify("Nomor soal harus unik dan positif.",true);return}if(type==="PG"){if(details.length!==5||!"ABCDE".includes(key)||key.length!==1){notify("PG memerlukan tepat lima opsi dan satu kunci A–E.",true);return}q.options=details;q.key="ABCDE".indexOf(key)}else{if(!details.length){notify("Essay memerlukan rubrik.",true);return}q.rubric=details}db.questions=editing===null?[...db.questions,q]:db.questions.map(x=>x.n===editing?q:x);save();closeModal();render();notify("Soal disimpan. Periksa kembali validasi distribusi.")}
});
document.addEventListener("change",e=>{let t=e.target;if(t.name==="answer"&&monitoring()){db.draft.answers[qs()[current].n]=Number(t.value);save();renderExam()}if(t.id==="result-sort"){sortField=t.value;render()}if(t.id==="cert-participant"){selectedResult=t.value;renderCertificate()}if(t.id==="import-file"&&teacher&&t.files[0]){let file=t.files[0];file.text().then(text=>{try{let x=JSON.parse(text);if(!x||!x.config||!Array.isArray(x.questions)||!Array.isArray(x.participants))throw Error();modal(`<h2>Pulihkan backup?</h2><p>Data saat ini akan diganti. Berkas berisi ${x.questions.length} soal dan ${x.participants.length} peserta.</p><div class="actions"><button class="btn danger" id="confirm-import">Ya, pulihkan</button><button class="btn secondary" data-action="close-modal">Batal</button></div>`);$("#confirm-import").addEventListener("click",()=>{db={config:{...defaults,...x.config},questions:x.questions,participants:x.participants,draft:x.draft||null};save();closeModal();render();notify("Backup dipulihkan.")})}catch{notify("Berkas JSON tidak sesuai format backup aplikasi.",true)}})}});
document.addEventListener("input",e=>{if(e.target.id==="essay-answer"&&monitoring()){db.draft.answers[qs()[current].n]=e.target.value;save()}if(e.target.id==="result-search"){search=e.target.value;let pos=e.target.selectionStart;render();let input=$("#result-search");input?.focus();input?.setSelectionRange(pos,pos)}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)scheduleViolation(700);else{clearTimeout(focusAlarm);if(activeDraft())updateTimer()}});
window.addEventListener("blur",()=>scheduleViolation(1600));
window.addEventListener("focus",()=>{clearTimeout(focusAlarm);if(activeDraft())updateTimer()});
document.addEventListener("fullscreenchange",()=>{if(fullscreenExam&&!document.fullscreenElement&&monitoring())violation();fullscreenExam=!!document.fullscreenElement&&monitoring()});
window.addEventListener("beforeunload",e=>{if(activeDraft()){save();e.preventDefault();e.returnValue=""}});
render();if(activeDraft())startTicker();
</script>
